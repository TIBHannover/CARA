services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cara}
      POSTGRES_DB: cara
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/tests/initdb.sql:/docker-entrypoint-initdb.d/test-db.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cara"]
      interval: 2s
      retries: 30

  backend:
    build: backend
    environment:
      CARA_DATABASE_URL: postgresql+psycopg://cara:${POSTGRES_PASSWORD:-cara}@db/cara
      CARA_IMAGE_ROOT: /data
      CARA_SECRET_KEY: ${CARA_SECRET_KEY:?set CARA_SECRET_KEY in .env}
      CARA_WORKERS: ${CARA_WORKERS:-4}
      CARA_DB_POOL_SIZE: ${CARA_DB_POOL_SIZE:-10}
      CARA_DB_MAX_OVERFLOW: ${CARA_DB_MAX_OVERFLOW:-10}
      CARA_TOKEN_MINUTES: ${CARA_TOKEN_MINUTES:-720}
      CARA_ADMIN_USERNAME: ${CARA_ADMIN_USERNAME:-admin}
      CARA_ADMIN_PASSWORD: ${CARA_ADMIN_PASSWORD:-}
    volumes: ["./data:/data:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 40

  frontend:
    build: frontend
    environment:
      CARA_API_URL: http://backend:8000
      STREAMLIT_BROWSER_SERVER_ADDRESS: ${CARA_PUBLIC_HOST:-localhost}
    ports: ["8501:8501"]
    depends_on:
      backend: {condition: service_healthy}

  # The documentation site, only when asked for: docker compose --profile docs up -d docs
  docs:
    image: squidfunk/mkdocs-material:9.7.7
    profiles: [docs]
    command: serve --dev-addr=0.0.0.0:8000 --livereload
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./docs:/docs/docs:ro
      - ./GLOSSARY.md:/docs/GLOSSARY.md:ro
    ports: ["127.0.0.1:8002:8000"]

volumes:
  pgdata:
