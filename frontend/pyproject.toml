[project]
name = "cara-frontend"
version = "0.1.0"
description = "Streamlit client for the CARA API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "streamlit>=1.50",
    "streamlit-dnd==0.2.0",
]

[dependency-groups]
dev = ["mypy>=1.11", "ruff>=0.6"]
e2e = [
    "playwright>=1.45",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
src = ["."]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
exclude = [".venv"]

[[tool.mypy.overrides]]
module = ["streamlit_dnd"]
ignore_missing_imports = true
