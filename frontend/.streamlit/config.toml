# Production-only settings (headless, no file watching) are in the Dockerfile.

[client]
# Hide Streamlit's developer controls from annotators.
toolbarMode = "viewer"
# Errors show their type only; the traceback is in the container log.
showErrorDetails = "type"
showErrorLinks = false

[runner]
magicEnabled = false

[server]
showEmailPrompt = false
# Serves static/ (fonts, driver.js) at app/static/.
enableStaticServing = true

[browser]
# No usage statistics.
gatherUsageStats = false
# serverAddress comes from CARA_PUBLIC_HOST in compose.yaml.

# Neutral palette with one accent, so colour on the judge page means a label.
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
dataframeHeaderBackgroundColor = "#F4F4F5"
textColor = "#18181B"
linkColor = "#4F46E5"
borderColor = "#E4E4E7"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
# Inter (SIL Open Font Licence, static/fonts/Inter-OFL.txt), served locally.
font = "Inter"
baseFontSize = 14
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-latin-ext.woff2"
weight = "400 700"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-latin.woff2"
weight = "400 700"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
